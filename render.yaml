# Render Blueprint: New > Blueprint > select this repository. Secrets marked sync:false are entered in the dashboard.
services:
  - type: web
    name: newspilot-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: MONGODB_URI, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: SITE_URL, sync: false }
      - { key: CLIENT_ORIGINS, sync: false }
      - { key: API_PUBLIC_URL, sync: false }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: ADMIN_NAME, value: Editor }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }
